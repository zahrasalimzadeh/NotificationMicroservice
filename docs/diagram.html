<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مسیر پیام | CoreBanking و RabbitMQ</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#f7f8fc;--card:#fff;--ink:#12152b;--mut:#5f6585;--line:#d8dbec;--s:#6d3fd6;--p:#0b8f87;--u:#c97800;--sb:#ece6fb;--pb:#dcf3f0;--ub:#fbeccf;--xb:#f1eee6;--ok:#0f8a5f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0c0e1b;--card:#161a33;--ink:#eceefc;--mut:#9aa0c6;--line:#2a2f52;--s:#b69cff;--p:#4fd8cd;--u:#ffbe55;--sb:#241d44;--pb:#12302f;--ub:#3a2c10;--xb:#26241d;--ok:#4fd8a0}}
:root[data-theme="dark"]{--paper:#0c0e1b;--card:#161a33;--ink:#eceefc;--mut:#9aa0c6;--line:#2a2f52;--s:#b69cff;--p:#4fd8cd;--u:#ffbe55;--sb:#241d44;--pb:#12302f;--ub:#3a2c10;--xb:#26241d;--ok:#4fd8a0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;overflow:hidden;background:var(--paper);background-image:radial-gradient(var(--line) 1px,transparent 1.3px);background-size:20px 20px;color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.9}
.wrap{max-width:1500px;height:100%;box-sizing:border-box;margin:0 auto;padding:8px 16px 10px;display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex:none}
.tt{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.en{direction:ltr;unicode-bidi:isolate;font-family:"DM Serif Display",Georgia,serif;font-weight:400}
h1{margin:0;font-size:.9rem;font-weight:600;color:var(--mut)}
.title{font-size:2rem;line-height:1;display:block;margin:0}
.scroll{flex:1 1 0;min-height:0;display:flex;align-items:center}
svg{width:100%;height:auto;max-height:100%;display:block}
.t0{font:800 15px Vazirmatn,sans-serif;fill:var(--ink)}
.t1{font:800 13px Vazirmatn,sans-serif;fill:var(--ink)}
.t2{font:400 10.5px Vazirmatn,sans-serif;fill:var(--mut)}
.fa{direction:rtl;unicode-bidi:isolate}
/* halos */
.halo{fill:none;stroke:var(--glow);stroke-width:7;opacity:0;transition:opacity .35s}
.halo.on{opacity:.38;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{50%{opacity:.14}}
/* wires */
.wg{opacity:.28;transition:opacity .4s}
.wg.on{opacity:1}
.wl{stroke:var(--c);fill:none;stroke-width:3;stroke-linecap:round;stroke-dasharray:6 7}
.hd{stroke:var(--c);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.wg.on .wl{animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-13}}
/* movers */
.m{transition-property:transform,opacity;transition-timing-function:ease-in-out;transition-duration:0ms}
.mi{transform-box:fill-box;transform-origin:center}
.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
#pm.walk #pmb{animation:bob .32s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
#bell{transform-box:fill-box;transform-origin:50% 0}
#bell.ring{animation:ring .9s ease-in-out}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(18deg)}40%{transform:rotate(-15deg)}60%{transform:rotate(10deg)}80%{transform:rotate(-5deg)}}
#phone{transform-box:fill-box;transform-origin:center}
#phone.vib{animation:vib .55s}
@keyframes vib{0%,100%{transform:translate(0) rotate(0)}15%{transform:translate(-3px,0) rotate(-5deg)}35%{transform:translate(3px,0) rotate(5deg)}55%{transform:translate(-2px,0) rotate(-3deg)}75%{transform:translate(2px,0) rotate(3deg)}}
#btn{transform-box:fill-box;transform-origin:center}
#btn.press{animation:press .5s}
@keyframes press{40%{transform:scale(.88)}100%{transform:scale(1)}}
/* panel */
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:8px 18px;height:clamp(150px,24dvh,230px);overflow:auto;flex:none}
.meta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.badge{background:var(--sb);color:var(--s);font-weight:800;font-size:.82rem;border-radius:999px;padding:1px 12px}
.dots{display:flex;gap:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);transition:background .3s,transform .3s}
.dots i.done{background:var(--p)}
.dots i.cur{background:var(--u);transform:scale(1.4)}
h2{margin:4px 0 0;font-size:clamp(1.05rem,1.6vw,1.4rem)}
.panel p{margin:2px 0 0;font-size:clamp(.9rem,1.35vw,1.2rem)}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:none}
button{font:inherit;font-weight:600;border:0;background:var(--s);color:#fff;border-radius:14px;padding:8px 22px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
button.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
button:focus-visible{outline:3px solid var(--s);outline-offset:2px}
#hint{color:var(--mut);font-size:.85rem}
.seg{display:flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card);direction:ltr}
.seg button{background:transparent;color:var(--ink);border-radius:0;padding:4px 18px;font-size:.9rem}
.seg button.on{background:var(--s);color:#fff}
body[data-l=en] .en{font-family:inherit;font-weight:700}
body[data-l=en] .title.en{font-family:"DM Serif Display",Georgia,serif;font-weight:400}
body[data-l=en] .fa{direction:ltr}
@media (max-height:520px){h1{display:none}.title{font-size:1.3rem}.panel{height:clamp(96px,34dvh,150px);padding:4px 12px}.panel p{font-size:.78rem;line-height:1.5}h2{font-size:.9rem}button{padding:5px 16px}}
@media (prefers-reduced-motion:reduce){.halo.on,.wg.on .wl,#pm.walk #pmb,#bell.ring,#phone.vib,#btn.press,.pop{animation:none}}
</style>
</head>

<script>
var $=function(id){return document.getElementById(id)};
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function put(el,x,y){el.style.transitionDuration='0ms';el.style.transform='translate('+x+'px,'+y+'px)';void el.getBoundingClientRect();}
function mv(el,x,y,ms){el.style.transitionDuration=ms+'ms';el.style.transform='translate('+x+'px,'+y+'px)';return wait(ms+30);}
function vis(el,v,ms){el.style.transitionDuration=(ms||0)+'ms';el.style.opacity=v;}
function pop(el){var i=el.firstElementChild;i.classList.remove('pop');void i.getBoundingClientRect();i.classList.add('pop');}
function kick(el,c){el.classList.remove(c);void el.getBoundingClientRect();el.classList.add(c);}
function fa(n){return lang=='fa'?n.toLocaleString('fa-IR'):String(n)}

var M=[$('m1'),$('m2'),$('m3')],codes=['48213','73190','20654'];
var ePm=$('pm'),eTag=$('eTag'),eGh=$('eGh'),eS=$('eS'),eOk=$('eOk'),eAck=$('eAck'),qc=$('qc');
var halos=['h_app','h_rmq','h_ex','h_q','h_n','h_s','h_p'],wires=['w1','w2','w3','w4','w5','w6'];
var qItems=[],pmBack=Promise.resolve(),cur=0,busy=false;
var HX=335,HY=308;
function qx(p){return 623-39*p}
function act(){var a=[].slice.call(arguments);halos.forEach(function(h){$(h).classList.toggle('on',a.indexOf(h)>-1)})}
function wire(){var a=[].slice.call(arguments);wires.forEach(function(w){$(w).classList.toggle('on',a.indexOf(w)>-1)})}
function face(d){$('pmf').style.transform='scale('+d+',1)'}
var unN=0;function setCount(un){unN=un||0;var n=qItems.length,L=T[lang],t=n?fa(n)+L.wait:L.empty;if(un)t+=' · '+fa(un)+L.proc;qc.textContent=t}

/* ---------- stages ---------- */
function spawn(m){put(m,205,236);vis(m,1);pop(m);}
async function send(m,f){wire('w1');act('h_rmq');await mv(m,HX,236,1200*f);wire();}
async function carry(m,f){
 await pmBack;
 vis(eTag,0,300);act('h_ex','h_q');
 ePm.classList.add('walk');face(1);
 await mv(m,HX+26,HY-27,400*f);
 wire('w2');
 await Promise.all([mv(ePm,420,HY,800*f),mv(m,446,HY-27,800*f)]);
 ePm.classList.remove('walk');
 qItems.push(m);var p=qItems.length-1;
 await mv(m,452,236,400*f);
 await mv(m,qx(p),236,Math.abs(qx(p)-452)*4*f);
 setCount();
 face(-1);ePm.classList.add('walk');
 pmBack=mv(ePm,HX,HY,800*f).then(function(){ePm.classList.remove('walk');face(1);});
}
async function take(m,f){
 qItems.shift();setCount(1);
 vis(eGh,.9,300);put(eGh,623,290);
 act('h_q','h_n');wire('w3');
 var jobs=[(async function(){await mv(m,655,236,350*f);await mv(m,738,262,650*f);})()];
 qItems.forEach(function(mm,p){jobs.push(mv(mm,qx(p),236,700*f))});
 await Promise.all(jobs);
 wire();kick($('bell'),'ring');
}
async function http(m,f){
 act('h_n','h_s');wire('w4');
 await mv(m,914,222,600*f);await mv(m,990,236,500*f);wire();
}
async function sms(m,i,f){
 act('h_s','h_p');wire('w6');
 $('smst').textContent=codes[i];
 vis(eS,0);put(eS,1136,236);vis(eS,1,150);pop(eS);
